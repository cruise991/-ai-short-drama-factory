# SRS (Simple Realtime Server) v5 流媒体服务主配置
# 端口规划: 1935 (RTMP 推流), 8085 (HTTP-FLV / HLS / HTTP API 分发)

listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_server {
    enabled         on;
    listen          8085;
    dir             ./objs/nginx/html;
}

http_api {
    enabled         on;
    listen          8085;
    crossdomain     on;
}

vhost __defaultVhost__ {
    # 低延迟设置
    tcp_nodelay     on;
    min_latency     on;
    mr {
        enabled     off;
    }
    mw_latency      100;

    # HTTP-FLV 实时分发
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    # HLS 移动端切片分发
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    2;
        hls_window      10;
    }

    # 录制归档（DVR，用于内容留痕与法务审计）
    dvr {
        enabled         on;
        dvr_path        /data/dvr/[app]/[stream]/[2006]-[01]-[02]_[15].[04].[05].flv;
        dvr_plan        session;
    }
}
