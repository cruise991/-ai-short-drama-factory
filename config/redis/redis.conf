# Redis 7 生产级配置 (用于低延迟 Streams 消息总线)
bind 0.0.0.0
port 6379
protected-mode no
tcp-backlog 511
timeout 0
tcp-keepalive 300

# 持久化设置 (AOF + RDB 双重保护)
save 900 1
save 300 10
save 60 10000

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# 内存策略：Streams 队列严禁发生随机驱逐 (noeviction)
maxmemory 512mb
maxmemory-policy noeviction

# 慢查询日志
slowlog-log-slower-than 10000
slowlog-max-len 128
