global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'shortdrama_backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8000']
        labels:
          group: 'core_api'
          env: 'production'

  - job_name: 'tts_service'
    metrics_path: '/health'
    static_configs:
      - targets: ['tts:8001']
        labels:
          group: 'microservices'

  - job_name: 'rag_service'
    metrics_path: '/health'
    static_configs:
      - targets: ['rag:8002']
        labels:
          group: 'microservices'
