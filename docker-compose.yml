version: '3.8'

services:
  ai-short-drama-factory:
    build: .
    container_name: short_drama_factory
    ports:
      - "8501:8501" # Expose Streamlit Web UI
    volumes:
      # Mount the configuration file so API keys can be edited without rebuilding
      - ./company_config.yaml:/app/company_config.yaml
      # Mount the working projects directory for persistent state
      - ./projects:/app/projects
      # [DELIVERY] Mount the isolated OUT directory so host can directly view audited finals
      - ../out:/out
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1

  minio:
    image: minio/minio:latest
    container_name: paperai_minio
    ports:
      - "${MINIO_API_PORT:-4000}:9000"     # S3 API
      - "${MINIO_CONSOLE_PORT:-4001}:9001" # Web Console
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-paperai2026}
      - MINIO_REGION=${MINIO_REGION:-auto}
    volumes:
      - ./projects/media_center_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: paperai_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-paperai2026}
      - S3_BUCKET=${S3_BUCKET:-paperai-media}
    entrypoint: >
      /bin/sh -c "
      echo 'MinIO is healthy, setting up bucket...' &&
      /usr/bin/mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      /usr/bin/mc mb myminio/$${S3_BUCKET} --ignore-existing &&
      /usr/bin/mc anonymous set public myminio/$${S3_BUCKET} &&
      echo 'Bucket initialized successfully.'
      "

  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: paperai_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
      - TUNNEL_TRANSPORT_PROTOCOL=http2
    depends_on:
      - minio
