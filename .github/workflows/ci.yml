name: LingCast & Drama Studio CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-testing:
    name: Backend Unit Tests & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r server/requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run Pytest Unit & Integration Tests
        env:
          DATABASE_URL: sqlite:///data/app.db
          JWT_SECRET_KEY: ci_test_secret_key_for_automated_testing_2026
          ENVIRONMENT: test
        run: |
          pytest tests/unit/ -v --cov=server --cov-report=term-missing

  frontend-testing:
    name: Frontend TypeScript & Vite Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run TypeScript Compile & Vite Build
        working-directory: frontend
        run: npm run build

  docker-compose-validate:
    name: Docker Compose & Topology Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet
