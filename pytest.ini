[pytest]
testpaths = tests
norecursedirs = 
    projects
    out
    third_party
    node_modules
    .git
    __pycache__
    skills
# Explicitly collect only files matching standard test patterns
python_files = test_*.py
# Ignore root-level debug scripts
collect_ignore_glob = 
    test_api*.py
    test_agnes*.py
    test_nana*.py
    test_direct*.py
    test_minio*.py
    test_orchestrator*.py
    test_r2*.py
    test_urllib*.py
    run_test.py
